<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FADELGNEMETCHACHE</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FADELGNEMETCHACHE">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#000;--card:#16181c;--tx:#e7e9ea;--mu:#71767b;--ac:#1d9bf0;--bd:#2f3336;--gold:#f5a623;color-scheme:dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#16181c;--tx:#e7e9ea;--mu:#71767b;--bd:#2f3336;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;font-size:15px}
.w{max-width:600px;margin:0 auto;min-height:100vh;border-left:1px solid var(--bd);border-right:1px solid var(--bd);padding-bottom:70px}
.hd{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:14px 16px;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.pad{padding:16px}.post{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.bd{flex:1;min-width:0}.mu{color:var(--mu)}.tg{color:var(--ac)}.gd{color:var(--gold)}
.act{display:flex;gap:26px;margin-top:8px;color:var(--mu)}.act span{cursor:pointer}.act .on{color:#f91880}
textarea,input{width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;margin-bottom:8px}
textarea{border:0;font-size:19px;resize:none;outline:0}
button{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--mu);padding:5px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.err{color:#f4212e;min-height:18px}
.rep{margin:8px 0 0;padding-left:10px;border-left:2px solid var(--bd)}.hide{display:none}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar a{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div class="w" id="root"></div>
<script>
// ====== À REMPLIR (Supabase > Settings > API) ======
var SUPABASE_URL = "https://unxexmkirmvsxmytvflt.supabase.co";      // ex : https://abcdxyz.supabase.co
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVueGV4bWtpcm12c3hteXR2Zmx0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyOTY0MzQsImV4cCI6MjExMDg3MjQzNH0.K3euGVWxLrx7VJpp_qQRdE3ULCerXsIl4jNg4mylpPc";           // la clé « anon public », jamais la service_role
// ===================================================
var SB, me, prof, posts = [], view = "home";
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){return esc(s).replace(/#([\wÀ-ÿ]+)/g,'<span class="tg">#$1</span>')}
function ago(t){var m=Math.round((Date.now()-new Date(t))/6e4);return m<1?"à l’instant":m<60?m+" min":m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" j"}
function show(h){$("root").innerHTML=h}
function lim(){return prof&&prof.premium?1000:280}
async function init(){
 if(SUPABASE_URL.indexOf("VOTRE")>=0){show('<div class="pad"><h2>Configuration</h2><p>Remplis SUPABASE_URL et SUPABASE_KEY en haut du code.</p></div>');return}
 SB=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 var s=(await SB.auth.getSession()).data.session;
 if(!s){authUI();return}
 me=s.user;await loadProfile()}
var em="";
function authUI(m){show('<div class="pad" style="margin-top:8vh"><h1 style="font-size:30px;margin:0 0 10px">FADELGNEMETCHACHE</h1><p class="mu">Connecte-toi avec ton adresse e-mail Gmail. Tu recevras un code de vérification.</p><input id="em" type="email" placeholder="ton.adresse@gmail.com" autocomplete="email"><p class="err" id="e">'+(m||"")+'</p><button onclick="sendCode()">Recevoir le code</button></div>')}
async function sendCode(){em=$("em").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em)){$("e").textContent="Adresse e-mail invalide.";return}
 var r=await SB.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});if(r.error){$("e").textContent=r.error.message;return}codeUI()}
function codeUI(m){show('<div class="pad" style="margin-top:8vh"><h2>Vérification</h2><p class="mu">Un code a été envoyé à '+esc(em)+'. Regarde aussi dans les spams.</p><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code de vérification"><p class="err" id="e">'+(m||"")+'</p><div class="row"><button onclick="verify()">Valider</button><button class="g" onclick="authUI()">Changer d’e-mail</button></div></div>')}
async function verify(){var t=$("cd").value.trim();if(!t){$("e").textContent="Entre le code reçu.";return}
 var r=await SB.auth.verifyOtp({email:em,token:t,type:"email"});if(r.error){$("e").textContent="Code incorrect ou expiré.";return}me=r.data.user;loadProfile()}
function finishUI(){show('<div class="pad" style="margin-top:8vh"><h2>Finalise ton inscription</h2><input id="nm" placeholder="Nom" maxlength="30"><input id="ps" placeholder="pseudo (lettres, chiffres, _)" maxlength="15"><p class="err" id="e"></p><button onclick="finish()">Terminer</button></div>')}
async function finish(){var r=await SB.rpc("creer_profil",{p_pseudo:$("ps").value.trim(),p_nom:$("nm").value.trim()});if(r.error){$("e").textContent=r.error.message.indexOf("profiles_pseudo")>=0?"Ce pseudo est déjà pris.":r.error.message;return}loadProfile()}
async function loadProfile(){var r=await SB.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=r.data;if(!prof){finishUI();return}await loadPosts();render()}
function finishUI(){show('<div class="pad" style="margin-top:8vh"><h2>Dernière étape</h2><input id="nm" placeholder="Nom" maxlength="30"><input id="ps" placeholder="pseudo (lettres, chiffres, _)" maxlength="15"><p class="err" id="e"></p><button onclick="finish()">Valider</button></div>')}
async function finish(){var r=await SB.rpc("creer_profil",{p_pseudo:$("ps").value.trim(),p_nom:$("nm").value.trim(),p_code:""});if(r.error){$("e").textContent=r.error.message;return}loadProfile()}
async function loadPosts(){var r=await SB.from("posts").select("id,texte,created_at,user_id,profiles(pseudo,nom,premium),likes(user_id),comments(id,texte,profiles(pseudo,nom))").order("created_at",{ascending:false}).limit(50);posts=r.data||[]}
function card(p){var u=p.profiles||{nom:"?",pseudo:"?"},lk=p.likes.some(function(l){return l.user_id===me.id});
 return '<div class="post"><div class="av">'+esc(u.nom[0])+'</div><div class="bd"><div><b>'+esc(u.nom)+'</b>'+(u.premium?' <span class="gd">✔</span>':'')+' <span class="mu">@'+esc(u.pseudo)+' · '+ago(p.created_at)+'</span></div><div style="white-space:pre-wrap;word-break:break-word">'+fmt(p.texte)+'</div>'
 +'<div class="act"><span onclick="opn('+p.id+')">💬 '+p.comments.length+'</span><span class="'+(lk?"on":"")+'" onclick="like('+p.id+','+lk+')">'+(lk?"❤️":"🤍")+' '+p.likes.length+'</span>'+(p.user_id===me.id?'<span onclick="del('+p.id+')">🗑</span>':'')+'</div>'
 +'<div id="rp'+p.id+'" class="hide">'+p.comments.map(function(c){return '<div class="rep"><b>'+esc(c.profiles.nom)+'</b> <span class="mu">@'+esc(c.profiles.pseudo)+'</span><div>'+esc(c.texte)+'</div></div>'}).join("")+'<div class="row" style="margin-top:8px"><input id="ri'+p.id+'" placeholder="Répondre…" maxlength="280" style="margin:0"><button onclick="rep('+p.id+')">Envoyer</button></div></div></div></div>'}
function opn(id){$("rp"+id).classList.toggle("hide")}
async function like(id,on){on?await SB.from("likes").delete().eq("post_id",id).eq("user_id",me.id):await SB.from("likes").insert({post_id:id,user_id:me.id});await loadPosts();render()}
async function del(id){await SB.from("posts").delete().eq("id",id);await loadPosts();render()}
async function rep(id){var t=$("ri"+id).value.trim();if(!t)return;await SB.from("comments").insert({post_id:id,user_id:me.id,texte:t});await loadPosts();render()}
async function post(){var t=$("tx").value.trim();if(!t)return;if(t.length>lim()){$("pe").textContent="Trop long : Premium = 1000 caractères.";return}
 var r=await SB.from("posts").insert({user_id:me.id,texte:t});if(r.error){$("pe").textContent=r.error.message;return}await loadPosts();render()}
function cnt(){$("ct").textContent=$("tx").value.length+"/"+lim()}
async function prem(){await SB.rpc("activer_premium_demo");await loadProfile()}
async function out(){await SB.auth.signOut();location.reload()}
function nav(v){view=v;render()}
function render(){var b;
 if(view==="plans")b='<div class="hd">Abonnements</div><div class="pad"><p><b>Gratuit</b> : posts de 280 caractères.</p><p><b>Premium <span class="gd">★</span> 4,99 €/mois</b> : posts de 1000 caractères et badge ✔ doré.</p>'+(prof.premium?'<b class="gd">Abonnement actif</b>':'<button onclick="prem()">Activer (démo)</button>')+'<p class="mu">Démo : à remplacer par Stripe.</p></div>';
 else if(view==="profile")b='<div class="hd">Profil<button class="g" onclick="out()">Déconnexion</button></div><div class="pad"><b style="font-size:20px">'+esc(prof.nom)+'</b>'+(prof.premium?' <span class="gd">✔</span>':'')+'<div class="mu">@'+esc(prof.pseudo)+'</div></div>'+posts.filter(function(p){return p.user_id===me.id}).map(card).join("");
 else b='<div class="hd">Accueil<button class="g" onclick="loadPosts().then(render)">↻</button></div><div class="post"><div class="av">'+esc(prof.nom[0])+'</div><div class="bd"><textarea id="tx" rows="2" placeholder="Quoi de neuf ?" oninput="cnt()"></textarea><div class="row"><span class="mu" id="ct">0/'+lim()+'</span><button onclick="post()">Poster</button></div><div class="err" id="pe"></div></div></div>'+(posts.map(card).join("")||'<p class="pad mu">Aucun tchat pour l’instant.</p>');
 show(b+'<div class="bar"><a onclick="nav(\'home\')">🏠 Accueil</a><a onclick="nav(\'plans\')">⭐ Premium</a><a onclick="nav(\'profile\')">👤 Profil</a></div>')}
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
init();
</script>
</body>
</html>
